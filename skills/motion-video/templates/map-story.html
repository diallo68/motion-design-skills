<!doctype html>
<!-- TEMPLATE map-story · 16.4 s · story / feed / square / landscape — a data story on a map, for marketplaces,
     delivery and local services: the outline of the area draws itself, the towns where the product is live light up
     with their real counts, photos pop out of the main town, then the towns still waiting get a question mark.
     Beats: 0-3.1 the outline and the promise · 3.2-9.2 the live towns and their numbers · 9.3-13.4 the empty towns,
            "and yours?" · 13.4-16.4 end card.
     The outline here is invented. For a real country or region, make it from a GeoJSON file (Natural Earth, public
     domain, has every country and its provinces) with the places' coordinates:
       node <skill>/scripts/geo-outline.mjs country.geojson --places places.json     → paste OUTLINE and PLACES
     Counts must be true (from the client's site or database, with the date): a map of real numbers is the point.
     Words in [brackets] name their role: write each from the client's concept (check.mjs reports any left). -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Map story</title>
<link rel="stylesheet" href="engine/motion.css">
<link rel="stylesheet" href="style.css">
<style>
  body { background: radial-gradient(90% 60% at 50% 55%, #1F2138 0%, #14152A 60%, #0C0C18 100%); color: #fff; --end-bg: #14152A; --end-ink: #fff; }
  .top { z-index: 10; }
  .h1 { color: #fff; } .h1 .o { color: var(--accent2, var(--accent)); }
  .sub { font: 600 40px/1.25 var(--font); color: #C9C9DA; margin-top: 16px; }
  body.landscape .top { right: 1180px; top: 380px; text-align: left; }
  body.square .h1 { font-size: 80px; } body.square .sub { font-size: 36px; margin-top: 10px; }
  #map { position: absolute; z-index: 2; }
  #map svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .land { fill: var(--accent); fill-opacity: 0; stroke: var(--accent); stroke-width: 5; stroke-linejoin: round; stroke-dasharray: 5200; stroke-dashoffset: 5200; vector-effect: non-scaling-stroke; }
  @keyframes trace { to { stroke-dashoffset: 0 } }
  @keyframes fillIn { to { fill-opacity: .16 } }
  .dot { position: absolute; width: 30px; height: 30px; margin: -15px 0 0 -15px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 10px color-mix(in srgb, var(--accent) 25%, transparent), 0 0 40px var(--accent); z-index: 5; }
  .dot.empty { background: #3A3C5A; box-shadow: 0 0 0 8px rgba(255,255,255,.08); }
  .dot.big { width: 46px; height: 46px; margin: -23px 0 0 -23px; }
  .lab { position: absolute; z-index: 6; background: #fff; color: #1A1A2E; border-radius: 18px; padding: 10px 16px; font: 800 32px/1 var(--font); white-space: nowrap; box-shadow: 0 10px 24px rgba(0,0,0,.35); }
  .lab b { font-size: 38px; }
  .lab.main { font-size: 34px; padding: 14px 22px; background: var(--accent); color: var(--accent-ink); }   /* the style pairs these two */ .lab.main b { font-size: 64px; letter-spacing: -.04em; display: block; margin-bottom: 4px; }
  .q { position: absolute; z-index: 6; width: 54px; height: 54px; margin: -66px 0 0 -27px; border-radius: 50%; background: #fff; color: #1A1A2E; display: grid; place-items: center; font: 900 34px var(--font); }
  .bub { position: absolute; z-index: 7; width: 150px; height: 150px; margin: -75px 0 0 -75px; border-radius: 50%; border: 6px solid #fff; overflow: hidden; box-shadow: 0 16px 34px rgba(0,0,0,.45); }
  .bub img { width: 100%; height: 100%; object-fit: cover; }
</style>
</head>
<body data-sfx="auto" data-duration="16.4" data-formats="story,feed,square,landscape">
  <div id="map" data-drift=".4,13.1,1.06"></div>   <!-- the camera closes in on the map through the whole film -->

  <div class="top center" data-out="outBlur@3.1/.2">
    <div class="h1" data-in="blurIn@.2/.4">[The&nbsp;promise] <span class="o">[everywhere]</span></div>
  </div>
  <div class="top center" data-show="3.2,9.2" data-out="outBlur@9/.2">
    <div class="h1" data-in="fadeUp@3.25/.5">[Main town] <span class="o">[is live]</span></div>
    <div class="sub" data-in="blurIn@6.6/.4">[The other live towns]</div>
  </div>
  <div class="top center" data-show="9.3,13.4">
    <div class="h1" data-in="whipInR@9.3/.4">[Question] <span class="o">[to the viewer]</span></div>
    <div class="sub" data-in="fadeUp@9.8/.45">[The invitation]</div>
  </div>

<script>
  // The area, in a 1000×700 box (invented here; geo-outline.mjs makes a real one in the same box).
  const OUTLINE = 'M939,350 L961,379 L933,405 L886,426 L862,449 L854,477 L828,501 L787,518 L750,536 L715,556 L665,559 L609,544 L567,536 L536,556 L500,584 L458,597 L415,602 L366,613 L316,616 L281,596 L257,568 L217,555 L157,550 L111,530 L99,493 L102,454 L101,418 L118,382 L159,350 L186,323 L172,294 L149,258 L159,228 L193,208 L218,186 L235,159 L264,139 L300,125 L327,99 L352,59 L394,35 L449,47 L500,74 L545,91 L588,105 L624,130 L654,154 L696,162 L743,169 L769,193 L766,227 L771,253 L802,268 L838,284 L862,304 L893,325 Z';
  // Places in the same box: n = the real count (0 = not live yet). The first is the main town. lab: label offset in px.
  const PLACES = [
    { name: '[Main town]', x: 250, y: 420, n: 214, lab: [-120, 50] }, { name: '[Town]', x: 400, y: 250, n: 12, lab: [30, -20] },
    { name: '[Town]', x: 190, y: 290, n: 6, lab: [-60, -80] },
    { name: '[Town]', x: 600, y: 200 }, { name: '[Town]', x: 720, y: 330 }, { name: '[Town]', x: 560, y: 450 },
    { name: '[Town]', x: 840, y: 420 }, { name: '[Town]', x: 470, y: 130 },
  ];
  const UNIT = '[Unit]';
  // Products from the main town that pop out of it: img (photo in assets/). Without img a stand-in is drawn.
  const PRODUCTS = [{ name: '[Product]', hue: 18 }, { name: '[Product]', hue: 45 }, { name: '[Product]', hue: 340 }];
  const standIn = (p, i) => 'data:image/svg+xml,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600"><defs><linearGradient id="g" x2="1" y2="1"><stop offset="0" stop-color="hsl(${p.hue} 70% 90%)"/><stop offset="1" stop-color="hsl(${p.hue} 55% 72%)"/></linearGradient></defs><rect width="600" height="600" fill="url(#g)"/>${['<circle cx="300" cy="300" r="170"', '<rect x="140" y="140" width="320" height="320" rx="70"', '<path d="M300 120 L480 460 L120 460 Z"'][i % 3]} fill="hsl(${p.hue} 65% 50%)"/></svg>`);

  // where the 1000×700 box sits in each format
  const F = new URLSearchParams(location.search).get('format') || document.body.dataset.format || 'story';
  const B = { story: [40, 600, 1000], feed: [90, 380, 900], square: [150, 300, 780], landscape: [820, 170, 1040] }[F];
  const k = B[2] / 1000, map = document.getElementById('map');
  Object.assign(map.style, { left: B[0] + 'px', top: B[1] + 'px', width: B[2] + 'px', height: B[2] * .7 + 'px' });
  const px = (x, y) => [x * k, y * k];
  let h = `<svg viewBox="0 0 1000 700" data-check="ui"><path class="land" d="${OUTLINE}" data-in="trace@.2/1.8:move" data-out="fillIn@1.8/.6:move"/></svg>`;
  const live = PLACES.filter((p) => p.n > 0), main = live[0];
  live.forEach((p, i) => {
    const [x, y] = px(p.x, p.y), a = i ? 6.8 + (i - 1) * .3 : 3.6;
    h += `<div class="dot${i ? '' : ' big'}" style="left:${x}px;top:${y}px" data-in="pop@${a}/.45"></div>`;
    h += i ? `<div class="lab" style="left:${x + p.lab[0]}px;top:${y + p.lab[1]}px" data-in="pop@${a + .15}/.35" data-out="fadeOut@9/.25">${p.name} <b>${p.n}</b></div>`
           : `<div class="lab main" style="left:${x + p.lab[0]}px;top:${y + p.lab[1]}px" data-in="fadeUp@3.8/.4" data-out="fadeOut@9/.25"><b data-count="0,${p.n},3.9,1.4,0">${p.n}</b> ${UNIT} · ${p.name}</div>`;
  });
  PLACES.filter((p) => !p.n).forEach((p, i) => {
    const [x, y] = px(p.x, p.y);
    h += `<div class="dot empty" style="left:${x}px;top:${y}px" data-in="pop@${(9.9 + i * .12).toFixed(2)}/.4"></div>`;
    h += `<div class="q" data-check="ui" style="left:${x}px;top:${y}px" data-in="pop@${(10.3 + i * .12).toFixed(2)}/.35">?</div>`;
  });
  // three products pop out of the main town, to its right
  const [mx, my] = px(main.x, main.y);
  PRODUCTS.forEach((p, i) => {
    const [dx, dy] = [[240, -20], [400, 60], [310, 170]][i].map((v) => v * Math.max(k, .8)), a = 4.6 + i * .25;
    h += `<div class="bub" style="left:${mx + dx}px;top:${my + dy}px" data-show="${a},9.2" data-in="pop@${a}/.45" data-out="outScale@9/.25"><img src="${p.img || standIn(p, i)}" alt=""></div>`;
  });
  map.innerHTML = `<div style="position:absolute;inset:0" data-out="fadeOut@13.1/.3">${h}</div>`;
</script>
<script src="engine/motion.js"></script>
<script>
  endcard({ at: 13.4, name: '[Name]', tagline: '[The offer, in one line]', cta: '[Address]', stores: ['apple', 'google'] });
</script>
</body>
</html>
