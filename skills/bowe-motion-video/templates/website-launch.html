<!doctype html>
<!-- TEMPLATE website-launch · 15 s · landscape / story / feed / square
     Beats: 0-2.8 statement · 2.8-4.6 browser arrives, URL types, page loads · 4.6-10.2 the page scrolls, three chips name
            what it offers, the cursor presses the main button · 9.35-12.2 the next scene opens in a circle from that
            button (iris) onto the same site on a phone · 12.2-15 endcard with the URL.
     The page inside the browser is plain HTML here. With a live site, capture it with
     `node <skill>/scripts/capture.mjs https://site --out assets/site-desktop.png` and replace .site with
     <img src="assets/site-desktop.png">. Only show the top of a real site if lower parts show real people's data.
     Words in [brackets] name their role: write each from the client's site and concept (check.mjs reports any left). -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Website launch</title>
<link rel="stylesheet" href="engine/motion.css">
<link rel="stylesheet" href="style.css">
<style>
  .br-wrap { position: absolute; left: 80px; right: 80px; top: 520px; height: 1180px; }
  body.landscape .br-wrap { left: 300px; right: 300px; top: 150px; height: 860px; }
  body.square .br-wrap { left: 70px; right: 70px; top: 230px; height: 780px; }
  body.feed .br-wrap { left: 70px; right: 70px; top: 260px; height: 1000px; }
  .br-wrap .browser { inset: 0; }

  /* stand-in site (replace with a capture) */
  .site { position: relative; font-family: var(--font); color: #1a1a1a; background: #fbfaf7; }
  .site nav { display: flex; align-items: center; gap: 30px; padding: 26px 40px; font: 600 22px var(--font); }
  .site nav b { font-size: 30px; margin-right: auto; letter-spacing: -.02em; }
  .site nav .cta { background: var(--accent); color: var(--accent-ink); padding: 12px 22px; border-radius: 30px; }
  .site .hero { padding: 50px 40px 40px; }
  .site h1 { font: 800 76px/1 var(--font-display); letter-spacing: -.04em; max-width: 800px; }
  .site .hero p { font: 500 26px/1.45 var(--font); color: #666; max-width: 620px; margin: 22px 0 30px; }
  .site .go { display: inline-block; background: #1a1a1a; color: #fff; padding: 20px 34px; border-radius: 40px; font: 700 24px var(--font); }
  .site .img { height: 380px; margin: 40px; border-radius: 24px; background: linear-gradient(135deg, var(--accent), var(--accent2)); }
  .site .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; padding: 0 40px 40px; }
  .site .grid3 div { height: 260px; border-radius: 20px; background: #eee9df; padding: 22px; font: 700 24px var(--font); }
  .site .price { margin: 0 40px 60px; padding: 40px; border-radius: 24px; background: #1a1a1a; color: #fff; font: 800 48px var(--font); }

  .scroller { position: absolute; left: 0; right: 0; top: 0; }   /* its height is the page's, so scrollPage can move it by a percentage */
  @keyframes scrollPage { 0%, 12% { transform: translateY(0) } 50%, 62% { transform: translateY(-38%) } 90%, 100% { transform: translateY(0) } }   /* back on top before the click */

  .ph-wrap { position: absolute; left: 50%; top: 520px; width: 420px; height: 870px; margin-left: -210px; }
  body.landscape .ph-wrap { top: 180px; }   /* under the title line, not over it */ body.feed .ph-wrap { top: 260px; transform: scale(.85); transform-origin: 50% 0; } body.square .ph-wrap { top: 160px; transform: scale(.85); transform-origin: 50% 0; }
  .ph-wrap .phone { left: 0; top: 0; }
  .ph-wrap { transform-origin: 50% 0; }   /* the slow push grows the phone downward, away from the title */
  .site.mobile h1 { font-size: 52px; } .site.mobile .hero { padding: 120px 28px 20px; } .site.mobile .img { margin: 20px 28px; height: 260px; } .site.mobile nav { padding: 70px 28px 0; position: absolute; }
</style>
</head>
<body data-sfx="auto" data-duration="15" data-formats="landscape,story,feed,square">
  <div class="bg-dots"></div>
  <div class="bg-glow" style="width:900px;height:900px;left:-300px;top:-300px" data-loop="drift/10"></div>

  <!-- 1. Statement -->
  <div class="top center" data-out="outUp@2.45/.35" data-drift=".6,2.8">
    <div class="h1" data-words=".2,.1">[The news] <span class="grad">[in two words]</span></div>
  </div>

  <!-- 2. Headline during the browser part -->
  <div class="top center" data-show="2.8,9.6">
    <div class="h2" data-in="blurIn@3/.5">[The site’s main promise]</div>
  </div>
  <style>body.landscape .top { top: 70px !important } body.landscape .top .h2, body.landscape .top .h1 { font-size: 64px } body.square .top { top: 80px !important }</style>

  <!-- 3. Browser -->
  <div class="br-wrap" data-show="0,10" data-drift="3.4,10,1.03">
    <div class="browser" data-in="fadeUp@2.85/.9">
      <div class="bar"><span class="lights"><i></i><i></i><i></i></span><span class="url"><span data-type="3.5,12">[Address]</span></span></div>
      <div class="progress" data-in="grow@4.6/.5" style="opacity:1"></div>
      <div class="view">
        <div class="scroller" data-in="scrollPage@5/3.9" style="animation-timing-function:var(--ease-io)">
          <div class="site" data-in="fadeIn@4.9/.3">
            <nav><b>[Name]</b><span>[Menu]</span><span>[Menu]</span><span>[Menu]</span><span class="cta">[Call to action]</span></nav>
            <div class="hero"><h1>[The site’s main title]</h1><p>[Its subtitle, as the site writes it]</p><span class="go" id="go" data-in="press@9.05/.3">[Main button]</span></div>
            <div class="img"></div>
            <div class="grid3"><div>[Offer 1]</div><div>[Offer 2]</div><div>[Offer 3]</div></div>
            <div class="price">[Price or proof]</div>
          </div>
        </div>
      </div>
    </div>
    <div class="cursor" data-point="#go@9.05" data-in="fadeIn@8.3/.3" data-out="fadeOut@9.7/.2"><span data-in="riseIn@8.3/.7" style="display:block">CURSOR</span></div>
  </div>

  <script>window.CHIPS = [
    { icon: 'sparkles', text: '[Offer 1]', at: 5.4, side: 'left', top: 620 },
    { icon: 'calendar', text: '[Offer 2]', at: 6.6, side: 'right', top: 860 },
    { icon: 'card', text: '[Offer 3]', at: 7.1, side: 'left', top: 1100, hold: 1.1 },
  ];</script>

  <!-- 4. Same site on a phone: the scene opens in a circle from the pressed button -->
  <div class="flood" style="background:var(--bg);z-index:6" data-show="9.3" data-in="iris@9.35/.5" data-out="fadeOut@12.2/.3" data-from="#go">
  <div class="bg-dots"></div>
  <div class="top center"><div class="h2" data-in="fadeUp@9.9">[The same, on a phone]</div></div>
  <div class="ph-wrap stage3d" data-drift="10.4,12.2">
    <div class="phone sm" data-in="phoneIn@9.75/1">
      <div class="screen" style="--screen-bg:#fbfaf7">
        <div class="site mobile">
          <nav><b>[Name]</b></nav>
          <div class="hero"><h1>[The site’s main title]</h1></div>
          <div class="img"></div>
        </div>
      </div>
    </div>
  </div>
  </div>

<script src="engine/motion.js"></script>
<script>
  document.querySelectorAll('.cursor > span').forEach((c) => c.innerHTML = icon('cursor'));
  const dy = { landscape: -420, story: 0, feed: -300, square: -380 }[FORMAT];
  chips(CHIPS.map((c) => ({ ...c, top: c.top + dy, inset: { landscape: 90, square: 40 }[FORMAT] })));   // story: the helper keeps right-hand chips clear of the platform's buttons
  endcard({ at: 12.2, name: '[Name]', tagline: '[The site’s main promise]', cta: '[Address]' });
</script>
</body>
</html>
